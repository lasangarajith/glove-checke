<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glove Print QC Inspector</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #1e293b;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            z-index: 10;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            background-color: #334155;
            color: #94a3b8;
        }

        .main-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #webcam, #canvasOutput {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #hiddenCanvas {
            display: none;
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 5;
        }

        .target-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 180px;
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .target-box::before, .target-box::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #38bdf8;
            border-style: solid;
        }

        .target-box::before {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
        }

        .target-box::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
        }

        .target-box.pass {
            border-color: #22c55e;
            border-style: solid;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .target-box.fail {
            border-color: #ef4444;
            border-style: solid;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .result-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            color: #94a3b8;
            transition: all 0.2s;
            z-index: 6;
        }

        .result-banner.pass {
            background-color: rgba(34, 197, 94, 0.9);
            color: #ffffff;
            border-color: #4ade80;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .result-banner.fail {
            background-color: rgba(239, 68, 68, 0.9);
            color: #ffffff;
            border-color: #f87171;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.05); }
        }

        .stats-panel {
            position: absolute;
            bottom: 120px;
            display: flex;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            z-index: 6;
        }

        .stat-card {
            flex: 1;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 12px;
            text-align: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .controls-panel {
            background-color: #1e293b;
            padding: 16px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: active 0.1s;
            pointer-events: auto;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #22c55e;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

            flex: 1;
            accent-color:
