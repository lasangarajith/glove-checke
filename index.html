<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glove QC Inspector</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 400px; height: 300px; object-fit: cover; border-radius: 12px; border: 2px solid #38bdf8; margin-top: 10px; background: #000; }
        .btn { background: #22c55e; color: #fff; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .box { margin-top: 15px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🔍 Glove QC Inspector</h2>
    <p>Camera එක පේනකම් ඉන්න...</p>
    
    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="box" id="statusText" style="color: #38bdf8;">Camera Loading...</div>
    
    <br>
    <button class="btn" id="btnCapture">📸 Capture Master Reference</button>

    <script>
        const video = document.getElementById('webcam');
        const statusText = document.getElementById('statusText');
        const btnCapture = document.getElementById('btnCapture');
        let masterImage = null;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
                statusText.textContent = "✅ Camera Ready! Capture Master Print.";
                statusText.style.color = "#22c55e";
            } catch (err) {
                statusText.textContent = "Camera Error: " + err.message;
                statusText.style.color = "#ef4444";
            }
        }

        btnCapture.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("Camera එක තවම load වෙනවා. පොඩ්ඩක් ඉන්න.");
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            masterImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            statusText.textContent = "🎯 Master Captured Successfully!";
            statusText.style.color = "#38bdf8";
        });

        initCamera();
    </script>
</body>
</html>
