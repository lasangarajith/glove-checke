<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glove Print QC System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background-color: #1e293b; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; height: 50px; }
        .title { font-size: 0.95rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .status-badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; background-color: #334155; color: #94a3b8; }

        .viewport { position: relative; flex: 1; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #hiddenCanvas { display: none; }

        .target-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 140px; border: 2px dashed #38bdf8; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); z-index: 5; transition: 0.2s; }
        .target-box.pass { border-color: #22c55e; border-style: solid; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4), 0 0 20px rgba(34, 197, 94, 0.6); }
        .target-box.fail { border-color: #ef4444; border-style: solid; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4), 0 0 20px rgba(239, 68, 68, 0.6); }

        .result-banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 18px; border-radius: 20px; font-size: 0.95rem; font-weight: 800; background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; color: #94a3b8; z-index: 6; letter-spacing: 0.5px; }
        .result-banner.pass { background-color: #22c55e; color: #fff; border-color: #4ade80; }
        .result-banner.fail { background-color: #ef4444; color: #fff; border-color: #f87171; }

        .footer-panel { background-color: #1e293b; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #334155; z-index: 10; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .stat-card { background: #0f172a; border-radius: 6px; padding: 6px 2px; text-align: center; border: 1px solid #334155; }
        .stat-val { font-size: 0.95rem; font-weight: 700; }
        .stat-lbl { font-size: 0.5rem; color: #94a3b8; text-transform: uppercase; margin-top: 2px; }

        .btn-row { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
        .btn-capture { background-color: #22c55e; color: #fff; flex: 2; }
        .btn-switch { background-color: #475569; color: #fff; }
        .btn-reset { background-color: #ef4444; color: #fff; flex: 0.7; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="title"><span>🛡️</span> Glove QC System</div>
        <div class="status-badge" id="statusBadge">CONNECTING</div>
    </header>

    <div class="viewport">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas"></canvas>

        <div class="result-banner" id="resultBanner">CAPTURE MASTER FIRST</div>
        <div class="target-box" id="targetBox"></div>
    </div>

    <div class="footer-panel">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="matchScore" style="color: #38bdf8;">--%</div>
                <div class="stat-lbl">Match</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="totalCount" style="color: #f8fafc;">0</div>
                <div class="stat-lbl">Total</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="passCount" style="color: #22c55e;">0</div>
                <div class="stat-lbl">Pass (OK)</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="failCount" style="color: #ef4444;">0</div>
                <div class="stat-lbl">Reject</div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn btn-capture" id="btnCapture">📸 CAPTURE MASTER</button>
            <button class="btn btn-switch" id="btnSwitchCam">🔄 SWITCH</button>
            <button class="btn btn-reset" id="btnReset">🔄 RESET</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const targetBox = document.getElementById('targetBox');
        const resultBanner = document.getElementById('resultBanner');
        const statusBadge = document.getElementById('statusBadge');
        const matchScoreEl = document.getElementById('matchScore');
        const totalCountEl = document.getElementById('totalCount');
        const passCountEl = document.getElementById('passCount');
        const failCountEl = document.getElementById('failCount');
        const btnCapture = document.getElementById('btnCapture');
        const btnSwitchCam = document.getElementById('btnSwitchCam');
        const btnReset = document.getElementById('btnReset');

        let currentStream = null;
        let facingMode = 'environment';
        let masterImageData = null;
        let total = 0;
        let passes = 0;
        let fails = 0;
        let lastResult = null;
        const threshold = 68; // Sensitivity threshold (68%)

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 440, duration = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = currentStream;
                await video.play();
                statusBadge.textContent = "LIVE";
                statusBadge.style.backgroundColor = "#22c55e";
                statusBadge.style.color = "#fff";
                requestAnimationFrame(processFrame);
            } catch (err) {
                statusBadge.textContent = "ERROR";
                statusBadge.style.backgroundColor = "#ef4444";
                alert("Camera Access Error: " + err.message);
            }
        }

        btnSwitchCam.addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        btnReset.addEventListener('click', () => {
            total = 0;
            passes = 0;
            fails = 0;
            lastResult = null;
            totalCountEl.textContent = "0";
            passCountEl.textContent = "0";
            failCountEl.textContent = "0";
            matchScoreEl.textContent = "--%";
            resultBanner.textContent = "COUNTERS RESET ✅";
            resultBanner.className = "result-banner";
        });

        function getTargetCropData() {
            const ctx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = video.videoWidth || 640;
            hiddenCanvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

            const cropW = Math.floor(hiddenCanvas.width * 0.4);
            const cropH = Math.floor(hiddenCanvas.height * 0.3);
            const cropX = Math.floor((hiddenCanvas.width - cropW) / 2);
            const cropY = Math.floor((hiddenCanvas.height - cropH) / 2);

            return ctx.getImageData(cropX, cropY, cropW, cropH);
        }

        btnCapture.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("Camera එක තවම load වෙනවා. පොඩ්ඩක් ඉන්න.");
                return;
            }
            masterImageData = getTargetCropData();
            resultBanner.textContent = "MASTER CAPTURED ✅";
            resultBanner.className = "result-banner pass";
            playBeep(880, 0.2);
        });

        function compareImages(curr, master) {
            const d1 = curr.data;
            const d2 = master.data;
            let diff = 0;
            let count = d1.length / 16;

            for (let i = 0; i < d1.length; i += 16) {
                diff += (Math.abs(d1[i] - d2[i]) + Math.abs(d1[i+1] - d2[i+1]) + Math.abs(d1[i+2] - d2[i+2])) / 3;
            }
            const avgDiff = diff / count;
            return Math.max(0, Math.round(100 - (avgDiff / 255 * 100)));
        }

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && masterImageData) {
                const currentData = getTargetCropData();
                const score = compareImages(currentData, masterImageData);

                matchScoreEl.textContent = score + "%";

                // To prevent hyper-counting rapid state flickering, we evaluate per glove item sequence
                if (score >= threshold) {
                    targetBox.className = "target-box pass";
                    resultBanner.className = "result-banner pass";
                    resultBanner.textContent = "PASS / OK (" + score + "%)";

                    if (lastResult !== 'PASS') {
                        passes++;
                        total = passes + fails;
                        passCountEl.textContent = passes;
                        totalCountEl.textContent = total;
                        lastResult = 'PASS';
                    }
                } else {
                    targetBox.className = "target-box fail";
                    resultBanner.className = "result-banner fail";
                    resultBanner.textContent = "REJECT / FAIL (" + score + "%)";

                    if (lastResult !== 'FAIL') {
                        fails++;
                        total = passes + fails;
                        failCountEl.textContent = fails;
                        totalCountEl.textContent = total;
                        lastResult = 'FAIL';
                        playBeep(220, 0.25);
                    }
                }
            }
            requestAnimationFrame(processFrame);
        }

        startCamera();
    </script>
</body>
</html>
