<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glove QC Inspector</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 400px; border-radius: 12px; border: 2px solid #38bdf8; margin-top: 10px; }
        .btn { background: #22c55e; color: #fff; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .box { margin-top: 15px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🔍 Glove QC Inspector</h2>
    <p>Camera එක අසලට Glove Print එක පෙන්වන්න</p>
    
    <video id="webcam" autoplay playsinline muted></video>
    
    <div class="box" id="statusText" style="color: #38bdf8;">STANDBY - Camera Loading...</div>
    
    <button class="btn" id="btnCapture">📸 Capture Master Reference</button>

    <script>
        const video = document.getElementById('webcam');
        const statusText = document.getElementById('statusText');
        const btnCapture = document.getElementById('btnCapture');
        let masterImage = null;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                statusText.textContent = "Camera Ready. Capture Master!";
            } catch (err) {
                statusText.textContent = "Camera Error: " + err.message;
                statusText.style.color = "#ef4444";
            }
        }

        btnCapture.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            masterImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
            statusText.textContent = "✅ Master Captured! Checking Active...";
            statusText.style.color = "#22c55e";
        });

        initCamera();
    </script>
</body>
</html>
