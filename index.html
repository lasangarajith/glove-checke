<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glove QC Inspector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .title { font-size: 1rem; font-weight: 700; color: #38bdf8; }
        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 12px; font-weight: 600; background-color: #334155; color: #94a3b8; }
        
        .main-container { position: relative; width: 100%; height: 350px; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #hiddenCanvas { display: none; }
        
        .target-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 140px; border: 2px dashed #38bdf8; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); z-index: 5; }
        .target-box.pass { border-color: #22c55e; border-style: solid; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 15px rgba(34, 197, 94, 0.4); }
        .target-box.fail { border-color: #ef4444; border-style: solid; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 15px rgba(239, 68, 68, 0.4); }
        
        .result-banner { text-align: center; padding: 8px; font-size: 1.1rem; font-weight: 800; background: #1e293b; color: #94a3b8; border-bottom: 1px solid #334155; }
        .result-banner.pass { background-color: #22c55e; color: #fff; }
        .result-banner.fail { background-color: #ef4444; color: #fff; }

        .stats-panel { display: flex; gap: 8px; padding: 10px; background: #0f172a; justify-content: center; }
        .stat-card { flex: 1; background: #1e293b; border-radius: 8px; padding: 8px; text-align: center; border: 1px solid #334155; }
        .stat-val { font-size: 1rem; font-weight: 700; }
        .stat-lbl { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }

        .controls-panel { background-color: #1e293b; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-start { background-color: #38bdf8; color: #0f172a; width: 100%; }
        .btn-primary { background-color: #22c55e; color: #fff; }
        .btn-secondary { background-color: #475569; color: #fff; }
        
        .slider-container { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #94a3b8; padding: 0 4px; }
        .slider-container input { flex: 1; accent-color: #38bdf8; }
    </style>
</head>
<body>

    <header>
        <div class="title">🔍 Glove QC Inspector</div>
        <div class="status-badge" id="statusBadge">OFFLINE</div>
    </header>

    <div class="result-banner" id="resultBanner">TAP START CAMERA FIRST</div>

    <div class="main-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="hiddenCanvas"></canvas>
        <div class="target-box" id="targetBox"></div>
    </div>

    <div class="stats-panel">
        <div class="stat-card">
            <div class="stat-val" id="matchScore">--%</div>
            <div class="stat-lbl">Match</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color:#22c55e;" id="passCount">0</div>
            <div class="stat-lbl">Pass</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color:#ef4444;" id="failCount">0</div>
            <div class="stat-lbl">Fail</div>
        </div>
    </div>

    <div class="controls-panel">
        <button class="btn btn-start" id="btnStart">📹 1. Start Camera</button>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnCapture">📸 2. Capture Master</button>
            <button class="btn btn-secondary" id="btnSwitchCam">🔄 Switch</button>
        </div>
        <div class="slider-container">
            <span>Strict</span>
            <input type="range" id="sensitivitySlider" min="50" max="95" value="70">
            <span>Lenient</span>
            <span id="thresholdVal" style="color:#f8fafc; font-weight:bold;">70%</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const targetBox = document.getElementById('targetBox');
        const resultBanner = document.getElementById('resultBanner');
        const statusBadge = document.getElementById('statusBadge');
        const matchScoreEl = document.getElementById('matchScore');
        const passCountEl = document.getElementById('passCount');
        const failCountEl = document.getElementById('failCount');
        const sensitivitySlider = document.getElementById('sensitivitySlider');
        const thresholdValEl = document.getElementById('thresholdVal');
        const btnStart = document.getElementById('btnStart');
        const btnCapture = document.getElementById('btnCapture');
        const btnSwitchCam = document.getElementById('btnSwitchCam');

        let currentStream = null;
        let facingMode = 'environment';
        let masterImageData = null;
        let threshold = 70;
        let passes = 0;
        let fails = 0;
        let lastResult = null;
        let isRunning = false;

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = currentStream;
                await video.play();
                statusBadge.textContent = "LIVE";
                statusBadge.style.backgroundColor = "#22c55e";
                statusBadge.style.color = "#fff";
                resultBanner.textContent = "CAPTURE MASTER PRINT";
                
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(processFrame);
                }
            } catch (err) {
                alert("Camera Error: " + err.message);
                statusBadge.textContent = "ERROR";
                statusBadge.style.backgroundColor = "#ef4444";
            }
        }

        btnStart.addEventListener('click', startCamera);

        btnSwitchCam.addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        sensitivitySlider.addEventListener('input', (e) => {
            threshold = parseInt(e.target.value);
            thresholdValEl.textContent = threshold + '%';
        });

        function getTargetCropData() {
            const ctx = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = video.videoWidth || 640;
            hiddenCanvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

            const cropW = Math.floor(hiddenCanvas.width * 0.4);
            const cropH = Math.floor(hiddenCanvas.height * 0.3);
            const cropX = Math.floor((hiddenCanvas.width - cropW) / 2);
            const cropY = Math.floor((hiddenCanvas.height - cropH) / 2);

            return ctx.getImageData(cropX, cropY, cropW, cropH);
        }

        btnCapture.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("Palamu camera start karanna!");
                return;
            }
            masterImageData = getTargetCropData();
            resultBanner.textContent = "MASTER CAPTURED - READY";
            resultBanner.className = "result-banner pass";
        });

        function compareImages(curr, master) {
            const d1 = curr.data;
            const d2 = master.data;
            let diff = 0;
            let total = d1.length / 16;

            for (let i = 0; i < d1.length; i += 16) {
                diff += (Math.abs(d1[i] - d2[i]) + Math.abs(d1[i+1] - d2[i+1]) + Math.abs(d1[i+2] - d2[i+2])) / 3;
            }
            const avgDiff = diff / total;
            return Math.max(0, Math.round(100 - (avgDiff / 255 * 100)));
        }

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && masterImageData) {
                const currentData = getTargetCropData();
                const score = compareImages(currentData, masterImageData);

                matchScoreEl.textContent = score + "%";

                if (score >= threshold) {
                    targetBox.className = "target-box pass";
                    resultBanner.className = "result-banner pass";
                    resultBanner.textContent = "OK / PASS (" + score + "%)";

                    if (lastResult !== 'PASS') {
                        passes++;
                        passCountEl.textContent = passes;
                        lastResult = 'PASS';
                    }
                } else {
                    targetBox.className = "target-box fail";
                    resultBanner.className, resultBanner.className = "result-banner fail";
                    resultBanner.textContent = "NOT OK / FAIL (" + score + "%)";

                    if (lastResult !== 'FAIL') {
                        fails++;
                        failCountEl.textContent = fails;
                        lastResult = 'FAIL';
                    }
                }
            }
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
